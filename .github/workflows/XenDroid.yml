name: XenDroid
on:
  pull_request:
    branches: main
    
  push:
    branches: main 

permissions:
  contents: write
  actions:  write

jobs:
  build-arm64_v8a:
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/cirruslabs/android-sdk:35

    # Allow to use gradle wrapper from xenia
    env:
      ANDROID_PLATFORM: android-35
      ANDROID_NDK_VERSION: 29.0.14206865

      # Gradle tuning
      GRADLE_OPTS: -Dorg.gradle.daemon=false

      # Native compile cache
      USE_CCACHE: 'true'
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content

    steps:

    - name: Check APK keystore
      run: |
        if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
          echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured."
          exit 1
        fi

    ##################################################################
    # Checkout
    ##################################################################
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Configure Git
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    ##################################################################
    # System tools
    ##################################################################
    - name: Install tools
      run: |
        apt-get update
        apt-get install -y ninja-build python3 glslang-tools spirv-tools


    ##################################################################
    # Cache Gradle
    ##################################################################
    - name: Cache Gradle
      uses:  gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-strict-match: false
        validate-wrappers: false


    ##################################################################
    # Android SDK / NDK
    ##################################################################
    - name: Cache NDK + CMake
      uses: actions/cache@v4
      with:
        path: |
          /opt/android-sdk-linux/ndk/${{ env.ANDROID_NDK_VERSION }}
          /opt/android-sdk-linux/cmake/3.30.3
        key: sdk-ndk${{ env.ANDROID_NDK_VERSION }}-cmake3.30.3

    - name: Install Android NDK
      run: |
        export ANDROID_SDK_ROOT=/opt/android-sdk-linux

        yes | sdkmanager --licenses

        if [ ! -d "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" ]; then
          sdkmanager "ndk;$ANDROID_NDK_VERSION"
        fi

        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV

    ##################################################################  
    # CMake Install
    ##################################################################
    - name: Install CMake
      run: |
        export ANDROID_SDK_ROOT=/opt/android-sdk-linux

        if [ ! -d "$ANDROID_SDK_ROOT/cmake/3.30.3" ]; then
            sdkmanager "cmake;3.30.3"
        fi

        echo "CMAKE_HOME=$ANDROID_SDK_ROOT/cmake/3.30.3" >> $GITHUB_ENV

    ##################################################################
    # local.properties
    ##################################################################
    - name: Generate local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    ##################################################################
    # Restore keystore
    ##################################################################
    - name: Decode keystore
      run: |
        if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
          echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured."
          exit 1
        fi

        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

        if [ ! -s release.keystore ]; then
          echo "::error::Failed to decode keystore or keystore is empty."
          exit 1
        fi

    - name: Check signing secrets
      run: |
        if [ ! -n "${{ secrets.KEY_ALIAS }}" ]; then
          echo "::error::Failed to fetch key alias."
          exit 1
        fi

        if [ ! -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
          echo "::error::Failed to fetch keystore password."
          exit 1
        fi

        if [ ! -n "${{ secrets.KEY_PASSWORD }}" ]; then
          echo "::error::Failed to fetch key password."
          exit 1
        fi

    ##################################################################
    # Gradle properties
    #################################################################
    - name: Generate gradle.properties
      run: |
        cat > gradle.properties <<EOF
        org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        org.gradle.parallel=true
        org.gradle.caching=true
        org.gradle.configuration-cache=true

        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

    ##################################################################
    # Native compile cache (ccache)
    ##################################################################
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ndk${{ env.ANDROID_NDK_VERSION }}-arm64
        max-size: 2G

    - name: Get Git hash
      id: git
      run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    ##################################################################
    # Build
    ##################################################################
    - name: Build Release APK
      run: |
        chmod +x gradlew

        ./gradlew assembleRelease \
          -PgitHash=${{ steps.git.outputs.hash }} \
          --build-cache \
          --parallel \
          --max-workers=$(nproc) \
          --no-daemon

    ##################################################################
    # Sign APK
    ##################################################################
    - name: Sign APK
      run: |
        APK=$(find . -name "*release*.apk" | head -n 1)

        "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign \
          --ks release.keystore \
          --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
          --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
          --key-pass pass:${{ secrets.KEY_PASSWORD }} \
          "$APK"

    - name: Verify Signature
      run: |
        APK=$(ls app/build/outputs/apk/release/*.apk)

        "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify "$APK"

    ##################################################################
    # Artifact naming
    ##################################################################
    - name: Compute SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Rename APK
      run: |
        APK=$(ls app/build/outputs/apk/release/*.apk)
        mv "$APK" "XenDroid_Release_${{ steps.vars.outputs.sha_short }}.apk"

    ##################################################################
    # Delete old artifacts if needed
    ##################################################################
    - name: Delete oldest artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;

          const artifacts = await github.paginate(
            github.rest.actions.listArtifactsForRepo,
            {
              owner,
              repo,
              per_page: 100
            }
          );

          // Ordina dal più vecchio al più recente
          artifacts.sort(
            (a, b) => new Date(a.created_at) - new Date(b.created_at)
          );
          
          if (artifacts.length >= 2) {
            for (const artifact of artifacts.slice(0, 2)) {
              core.info(`Deleting artifact: ${artifact.name}`);

              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id
              });
            }
          } else {
            core.info("Less than 2 artifacts found, nothing to delete.");
          }

    - name: Upload artifact
      if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: XenDroid_Release_${{ steps.vars.outputs.sha_short }}
        path: XenDroid_Release_${{ steps.vars.outputs.sha_short }}.apk

    - name: Create GitHub Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: XenDroid-${{ steps.vars.outputs.sha_short }}
        name: XenDroid ${{ steps.vars.outputs.sha_short }}
        generate_release_notes: true
        files: XenDroid_Release_${{ steps.vars.outputs.sha_short }}.apk
